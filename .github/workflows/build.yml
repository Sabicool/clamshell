# Builds Clamshell and checks it against Anki on every push. Pushing a tag like
# v0.3.0 also publishes a GitHub release with the .3dsx attached.
name: Build and test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    name: Desktop tests against Anki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libcurl
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the desktop tools
        run: make -f Makefile.host -j"$(nproc)" all build/host/anki3ds-cli-3dsnet
      - name: Install the anki package to compare against
        run: python -m venv tools/.venv && tools/.venv/bin/pip install anki==26.08 pillow
      - name: Build the demo collection
        run: tools/.venv/bin/python tools/demo_collection.py build/demo/collection.anki2
      - name: Scheduling matches Anki
        run: tools/.venv/bin/python tools/difftest.py build/demo/collection.anki2
      - name: Bury, suspend, flags and mark match Anki
        run: tools/.venv/bin/python tools/opstest.py
      - name: Sync round trip with Anki's sync server
        run: tools/.venv/bin/python tools/synctest.py build/demo/collection.anki2
      - name: Sync round trip using the 3DS network code
        run: ANKI3DS_CLI=build/host/anki3ds-cli-3dsnet tools/.venv/bin/python tools/synctest.py build/demo/collection.anki2

  build-3ds:
    name: 3DS build
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build clamshell.3dsx
        run: make -C 3ds -j"$(nproc)"
      - uses: actions/upload-artifact@v4
        with:
          name: clamshell-3dsx
          path: 3ds/clamshell.3dsx

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build-3ds]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the app's version
        run: |
          version=$(sed -n 's/^#define ANKI3DS_VERSION "\(.*\)"/\1/p' core/version.h)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match core/version.h ($version)"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: clamshell-3dsx
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" clamshell.3dsx
          --title "Clamshell $GITHUB_REF_NAME"
          --generate-notes
          --prerelease
